<div class="containerOfNav">
  <nav class="navbar navbar-expand-md navbar-dark fixed-top" style="background-color: #242020;">
    <a class="navbar-brand" href="#"></a>
    <button class="navbar-toggler" type="button" (click)="toggleNavbar()">
      <span class="navbar-toggler-icon"></span>
    </button>
    <!-- <div class="containerNavbar"> -->
    <div class="collapse navbar-collapse" id="navbarsExampleDefault"
      [ngClass]="{ 'show': navbarOpen, 'collapseFrame': navbarOpen }">
      <ul class="navbar-nav mr-auto">
        <li *ngIf="ifDisplayHome()" class="nav-item">
          <a class="nav-link" (click)="routeToYourLocalities() "
            [ngClass]="{ 'navbarTogglerActive': navbarOpen }">Home</a>
        </li>
        <li *ngIf="ifDisplayLocalities()" class={{activePage.homePage}}>
          <a class="nav-link" (click)="routeToUserLocalities()" [ngClass]="{ 'navbarTogglerActive': navbarOpen }">{{userLocalities_txt}}</a>
        </li>
        <li *ngIf="ifDisplayLocality()" class={{activePage.loaclity}} ngbDropdown>
          <a class="nav-link dropdown-toggle" id="dropdown01" ngbDropdownToggle
            [ngClass]="{ 'navbarTogglerActive': navbarOpen }">{{locality_txt}}</a>
          <div ngbDropdownMenu class='dropdownStyle' aria-labelledby="dropdown01">
            <a *ngFor="let locality of allLocality" class="dropdown-item"
              (click)="routeToUserLocality(locality.name)">{{locality.name}}</a>
          </div>
        </li>
        <li *ngIf="ifDisplayAdd()" class={{activePage.add}} ngbDropdown>
          <a class="nav-link dropdown-toggle" id="dropdown02" ngbDropdownToggle
            [ngClass]="{ 'navbarTogglerActive': navbarOpen }">Add</a>
          <div ngbDropdownMenu class='dropdownStyle' aria-labelledby="dropdown02">
            <a class="dropdown-item" (click)='routerService.inputLocality()'>Input locality </a>
            <a class="dropdown-item" (click)='routerService.inputMineral()'>Input mineral </a>
            <a *ngIf="this.auth.isUserAdmin()" class="dropdown-item" (click)='routerService.adminHlavni()'>Admin page
            </a>
          </div>
        </li>
        <li class={{activePage.otherUsers}}>
          <a class="nav-link" (click)='routerService.otherUsers(0)'
            [ngClass]="{ 'navbarTogglerActive': navbarOpen }">{{otherUsers_txt}}</a>
        </li>
      </ul>
      <!-- <form class="form-inline my-2 my-lg-0" [ngClass]="{ 'navbarTogglerActive': navbarOpen }">
          <input class="form-control mr-sm-2" type="text" placeholder="Search" aria-label="Search">
          <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
        </form> -->
      <!-- <img class="settingsImage" src="../../../assets/skins/Like_medium.jpg"> -->
      <div ngbDropdown>
        <img *ngIf="auth.isLoggedIn()" class="settingsImage dropdown-toggle" ngbDropdownToggle [src]="imgSrc"
          (mouseover)="imgSrc = '../../../assets/skins/settings_button_hover.png'"
          (mouseout)="imgSrc = '../../../assets/skins/settings_button.png'"
          [ngClass]="{ 'settingsButton': navbarOpen }">
        <div *ngIf="auth.isLoggedIn()" ngbDropdownMenu class='dropdownStyle' aria-labelledby="dropdown03"
          [ngClass]="{ 'settingsButtonDropdown': navbarOpen }">
          <a *ngIf="this.auth.isLoggedIn()" class="dropdown-item" (click)='routerService.userSettings()'>User settings
          </a>
          <a *ngIf="this.auth.isUserAdmin()" class="dropdown-item" (click)='routerService.adminHlavni()'>Admin page
          </a>
        </div>

        <button *ngIf="auth.isLoggedIn()" class="btn btn-outline-success my-2 my-sm-0" (click)="logOutHandler()"
          [ngClass]="{ 'logButton': navbarOpen }">{{logOut_txt}}</button>
        <button *ngIf="!auth.isLoggedIn()" class="btn btn-outline-success my-2 my-sm-0" (click)="logInHandler()"
          [ngClass]="{ 'logButton': navbarOpen }">{{logIn_txt}}</button>
      </div>
    </div>
    <!-- </div> -->
  </nav>
</div>
