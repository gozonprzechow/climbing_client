<div class="containerOfNav">
  <nav
    class="navbar navbar-expand-md navbar-dark fixed-top"
    style="background-color: #242020"
  >
    <a class="navbar-brand" href="#"></a>
    <button class="navbar-toggler" type="button" (click)="toggleNavbar()">
      <span class="navbar-toggler-icon"></span>
    </button>
    <!-- <div class="containerNavbar"> -->
    <div
      class="collapse navbar-collapse"
      id="navbarsExampleDefault"
      [ngClass]="{ show: navbarOpen, collapseFrame: navbarOpen }"
    >
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <img
          class="backArrowImage"
          [src]="img_step_back"
          (mouseover)="img_step_back = '../../../assets/skins/back_arrow_hoover.png'"
          (mouseout)="img_step_back = '../../../assets/skins/back_arrow.png'"
          (click)="routeStepBack()"
          [ngClass]="{ phoneModeBack: navbarOpen }"
        />
      </ul>

      <div>
        <img
          *ngIf="this.isShowGoInside()"
          class="alertImage"
          [src]="img_go_inside"
          (mouseover)="img_go_inside = '../../../assets/skins/inside_arrow_hover.png'"
          (mouseout)="img_go_inside = '../../../assets/skins/inside_arrow.png'"
          (click)="routeGoInside()"
          [ngClass]="{ phoneModeAlertFriendship: navbarOpen }"
        />
      </div>
    </div>
    <!-- </div> -->
  </nav>
</div>
