<div class="btn-group" role="group" aria-label="Basic example">
  @for (buttonCollection of buttonCollections; track buttonCollection) {
    <button
      type="button"
      class="btn pagingButtons"
      [ngClass]="{ active: buttonCollection.activeButton }"
      aria-label="Close"
      (click)="clickPageButton(buttonCollection.buttonNumber)"
      >
      {{ buttonCollection.buttonNumber }}
    </button>
  }
</div>
