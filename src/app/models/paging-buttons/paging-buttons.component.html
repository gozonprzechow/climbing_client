<div class="btn-group" role="group" aria-label="Basic example">
  <button *ngFor="let buttonCollection of buttonCollections" type="button" class="btn pagingButtons"
    [ngClass]="{ 'active': buttonCollection.activeButton }" aria-label="Close"
    (click)="clickPageButton(buttonCollection.buttonNumber)">{{this.buttonCollection.buttonNumber}}</button>
</div>
