<app-main-navbar-menu [allLocality]=allLocality [activePage]=activePage></app-main-navbar-menu>

<custom-tittle-main [tittleMain]=titleMain_txt></custom-tittle-main>

<div class="container">
  <div class="mainFormClass">
    <form [formGroup]="userForm" (ngSubmit)="openConfirmModal()">

      <div class="form-group" [ngClass]="{ 'has-error': invalidEmail() }">
        <!-- Last Name -->
        <div class="col-sm-12">
          <label for="email" class="control-label required">Email</label>
          <input type="text" formControlName="email" class="form-control" id="email" name="email" placeholder="email">
          <p *ngIf="invalidEmail()" id="email_error" class="help-block">
            {{this.serviceErrors.email || 'Invalid email.'}}</p>
          <p class="help-block"> {{this.serverServiceErrors.email}}</p>
        </div>
      </div>

      <div class="submitContainer">
        <p id="successLoadCondition"> {{this.inputCondition.errorLoad}}</p>
      </div>

      <div class="form-group has-error">
        <div class="submitContainer">
          <!-- Register Button -->
          <button type="submit" class="submitButton">{{deleteAccount_txt}}</button>
        </div>
      </div>
      <div class="submitContainer">
        <br><br>
        <p>{{registeredUsers_txt}} {{serverInfo.registerUsers}}</p>
        <p>{{imagesSpace_txt}} {{this.convertedBytes.numberofBytes}}
          [{{this.convertedBytes.unit}}]</p>
      </div>
    </form>
  </div>
</div>
