<custom-tittle-main [tittleMain]=tittleMain></custom-tittle-main>

<div class="container">
  <div class="mainFormClass">
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">

      <div class="form-group" [ngClass]="{ 'has-error': invalidEmail() }">
        <!-- Last Name -->
        <div class="col-sm-12">
          <label for="email" class="control-label required">Email</label>
          <input type="text" formControlName="email" class="form-control" id="email" name="email" placeholder="email">
          <p *ngIf="invalidEmail()" id="email_error" class="help-block">
            {{this.serviceErrors.email || 'Invalid email.'}}</p>
          <p class="help-block"> {{this.serverServiceErrors.email}}</p>
        </div>
      </div>

      <div class="submitContainer">
        <p id="successLoadCondition"> {{this.serverServiceErrors.uploadSuccess}}</p>
      </div>

      <div class="submitContainer">
        <p> {{errorMessage}}</p>
      </div>

      <div class="form-group has-error">
        <div class="submitContainer">
          <p class="help-block"> {{this.inputCondition.errorLoad && this.serverServiceErrors.uploadSuccess}}
            {{this.returnMessage}}
          </p>
        </div>
        <div class="submitContainer">
          <button type="submit" class="submitButton">Recover password</button>
        </div>
      </div>
    </form>
  </div>
</div>
