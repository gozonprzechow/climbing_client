<app-main-navbar-menu
  [allLocality]="allLocality"
  [activePage]="activePage"
></app-main-navbar-menu>
<custom-tittle-main [tittleMain]="titleMain_txt"></custom-tittle-main>

<div class="wrapper" center="block">
  <div class="mainFormClass" center="block">
    <div class="wrap">
      <div
        *ngFor="let otherUsersCollection of otherUsersCollections; let i = index"
        class="localityWrapper"
      >
        <a
          class="userName"
          (click)="routeToAnotherUsersLocalities(otherUsersCollection.otherUser.postedBy)"
          >{{ otherUsersCollection.otherUser.name }}</a
        >
        <div class="dropdownLocality" ngbDropdown>
          <button
            *ngIf="chatService.isDropDownActive(otherUsersCollection.otherUser.postedBy)"
            type="button"
            id="dropdown01"
            class="top-right btn-secondary dropdown-toggle"
            ngbDropdownToggle
          ></button>
          <div
            *ngIf="chatService.isDropDownActive(otherUsersCollection.otherUser.postedBy)"
            ngbDropdownMenu
            class="dropdownStyle"
            aria-labelledby="dropdown01"
          >
            <a
              *ngIf="
                chatService.isSendMessageActive(otherUsersCollection.otherUser.postedBy)
              "
              (click)="sendMessage(otherUsersCollection.otherUser)"
              class="dropdown-item"
            >
              {{ sendMessage_txt }}</a
            >
            <a
              *ngIf="chatService.isAddFriendActive(otherUsersCollection.otherUser)"
              class="dropdown-item"
              (click)="sendFriendshipRequest(otherUsersCollection.otherUser.postedBy, i)"
              >{{ addFriend_txt }}</a
            >
            <a
              *ngIf="chatService.isConfirmFriendActive(otherUsersCollection.otherUser)"
              class="dropdown-item"
              (click)="sendConfirmFriendship(otherUsersCollection.otherUser.postedBy, i)"
              >{{ confirmFriend_txt }}</a
            >
          </div>
        </div>
        <br /><br />
        <div class="row">
          <div
            *ngFor="let achatdbCollection of otherUsersCollection.achatdbCollections"
            class="col"
          >
            <div *ngIf="achatdbCollection" class="imageContainer">
              <img
                [attr.src]="
                  imageService.getImage(
                    achatdbCollection.imgName,
                    achatdbCollection.imgPath
                  )
                "
                class="imageLocality"
                (click)="openModal(achatdbCollection, i)"
              />
              {{ achatdbCollection.title }}<br />
            </div>
          </div>
        </div>
        <hr class="enderLine" />
        <div></div>
      </div>
      <app-paging-buttons
        *ngIf="this.pagingButtons.ifAnyMorePage()"
        [buttonCollections]="buttonCollections"
        (clickPageButtonEvent)="clickPageButton($event)"
      ></app-paging-buttons>
    </div>
  </div>
</div>
