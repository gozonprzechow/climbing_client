# ################ only sutrak.net and www.sutrak.net ####################
<VirtualHost *:80>
  DocumentRoot /www/hosting/sutrak.net/www
  ServerName sutrak.net
  ServerAlias www.sutrak.net
  ServerAlias www.sutrak.net.tle06.vas-server.cz sutrak.net.tle06.vas-server.cz

  Use sutrak.net

#  RewriteEngine On
#  RewriteCond %{HTTPS} !=on
#  RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301,NE] 

</VirtualHost>

<VirtualHost *:443>
  DocumentRoot /www/hosting/sutrak.net/www
  Servername sutrak.net
  ServerAlias www.sutrak.net
  ServerAlias www.sutrak.net.tle06.vas-server.cz sutrak.net.tle06.vas-server.cz

  Use sutrak.net
