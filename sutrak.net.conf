# 
# ################ Macro sutrak.net ####################
<Macro sutrak.net>
  ServerAdmin postmaster@sutrak.net
  ErrorLog /var/log/apache2/sutrak.net/error-sutrak.net.log
  CustomLog /var/log/apache2/sutrak.net/access-sutrak.net.log combined

## odkomentovat, pokud se ma web presmerovavat automaticky z http na https - pozor, bude automaticky pro vsechny subdomeny!!!
   RewriteEngine On
   RewriteCond %{HTTPS} off
   RewriteCond %{REQUEST_URI} !^/\.well\-known/acme\-challenge/ [NC]
#  RewriteRule (.*) https://%{SERVER_NAME}$1 [R,L]

  <Directory "/www/hosting/sutrak.net">
    Options -Indexes +FollowSymLinks -MultiViews +SymLinksIfOwnerMatch +IncludesNoExec -Includes
	AllowOverride AuthConfig FileInfo Indexes Limit Options=Indexes,MultiViews,FollowSymLinks
	<Limit GET POST OPTIONS>
		Require all granted
	</Limit>
	<LimitExcept GET POST OPTIONS>
		Require all denied
	</LimitExcept>

	Require all granted
    <IfModule mod_access_compat.c>
        Order allow,deny
        Allow from all
    </IfModule>
  </Directory>

  <IfModule mod_proxy_fcgi.c>
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php8.0-fpm-sutrak.net.sock|fcgi://localhost"
    </FilesMatch>
    <LocationMatch "/php_status">
        SetHandler "proxy:unix:/run/php8.0-fpm-sutrak.net.sock|fcgi://localhost"
        Require ip 127.0.0.1 95.168.219.1 ::1
    </LocationMatch>
	ProxyTimeout 360
  </IfModule>

</Macro>

# 
# ################ Macro sutrak.net-ssl ####################
<Macro sutrak.net-ssl>
  SSLEngine On
  SSLCertificateFile /etc/letsencrypt/live/sutrak.net/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/sutrak.net/privkey.pem
  ##SSLCertificateChainFile /etc/ssl/certs/ca.vas-hosting.cz.pem
  ##SSLCACertificateFile /etc/ssl/certs/ca.vas-hosting.cz.pem
  BrowserMatch "MSIE [2-6]" \
    nokeepalive ssl-unclean-shutdown \
    downgrade-1.0 force-response-1.0
    # MSIE 7 and newer should be able to use keepalive
  BrowserMatch "MSIE [17-9]" ssl-unclean-shutdown

  <FilesMatch "\.(cgi|shtml|phtml|php)$">
    SSLOptions +StdEnvVars
  </FilesMatch>
  <Directory /usr/lib/cgi-bin>
    SSLOptions +StdEnvVars
  </Directory>
</Macro>


#                 ########################
